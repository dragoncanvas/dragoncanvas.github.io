<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DragON Canvas</title>
  <link rel='shortcut icon' href='images/dragon.jpg' type='image/x-icon' />
  <script src='tailwindcss.min.js'></script>
  <script src="dom-to-image.min.js"></script>
<style>
  
  * { margin: 0; padding: 0; overflow: hidden; }
  html, body, canvas{
    /* background-image: url('images/white-bg.jpg'); */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  canvas { 
    width: 100vw; 
    height: 100vh; 
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    -moz-user-select: none;
    -ms-user-select: none;
    cursor: default;
  }
  img { cursor: drag; }


</style>
</head>
<body>
<!-- Add this to your HTML -->
<ul id="contextMenu" 
    style="display: none; position: absolute;" 
    class="bg-white border border-gray-300 rounded-md shadow-lg w-40 p-2 space-y-2 cursor-pointer text-gray-700 text-sm z-50">
  <!-- <li id="bringForward" class="hover:bg-blue-500 hover:text-white px-4 py-2 rounded-md transition-colors duration-200">Bring Forward</li> -->
  <li id="sendBackward" class="hover:bg-blue-500 hover:text-white px-4 py-2 rounded-md transition-colors duration-200">Send Backward</li>
</ul>



<div class="flex relative h-11 justify-between items-center">

  <div class="flex ml-0">
    <label for="imageLoader" class="max-w-4 leading-tight text-sm text-[#f7f7f7]">Upload Images</label>
    <input
      type="file"
      id="imageLoader"
      accept="image/*"
      multiple
      class="w-1/3 -ml-1 mt-1 h-6 block text-sm text-gray-900 rounded-md cursor-pointer focus:outline-none focus:ring-0 focus:border-none focus:bg-green-400" />
  </div>

<!--  -->
  


<div id="helpTip" class="-ml-32 -mt-0 text-gray-500 hidden">
  <p><span class="font-bold text-gray-600">TOGGLE H</span> (For Help)</p>
</div>


<!--  -->


  <div class="flex gap-2 mr-2 cursor-pointer">
    <div id="downloadBtn" title="Download Image Layout">
      <img class="h-8" src="images/download.svg">
    </div>
    
    <div id="theme" title="Change Canvas Background Color">
      <img id="lightIcon" class="h-8 icon" src="images/moon.svg">
      <img id="darkIcon" class="h-8 icon hidden" src="images/sun.svg">
    </div>

    <div id="clearCanvas" title="Remove All Images From Canvas">
      <img class="h-8" src="images/trash.svg">
    </div>
  </div>
<!--  -->
<!--  -->
<!--  -->
</div>
<!--  -->




<!--  -->
<!--  -->
<canvas id="canvas"></canvas>
<!--  -->
<!--  -->






<script src="script.js"></script>
</body>
</html>
